name: LocalEats CI with Liquibase

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore LocalEats.sln

    - name: Build solution
      run: dotnet build LocalEats.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test LocalEats.sln --configuration Release --no-build --logger trx --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./TestResults

  liquibase-migration:
    runs-on: ubuntu-latest
    needs: build-te
